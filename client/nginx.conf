user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;

    gzip            on;
    gzip_static     on;

    ssl_prefer_server_ciphers on;

    client_max_body_size   200m;
    proxy_buffer_size      256k;
    proxy_buffers          4 512k;
    proxy_busy_buffers_size 512k;

    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;
        server_name localhost;
        root /var/www/aracardi;

        # -------------------------------------------------------------------------
        # Security headers
        # -------------------------------------------------------------------------
        add_header X-Content-Type-Options  "nosniff"                          always;
        add_header X-Frame-Options         "SAMEORIGIN"                       always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin"  always;
        add_header Permissions-Policy      "geolocation=(), microphone=(), camera=()" always;

        # -------------------------------------------------------------------------
        # Never cache — version control & PWA manifest
        # -------------------------------------------------------------------------
        location ~* (service-worker\.js|/_app/version\.json|manifest\.json)$ {
            expires -1;
            add_header Cache-Control                "no-store, no-cache, must-revalidate, proxy-revalidate" always;
            add_header Pragma                       "no-cache"  always;
            add_header CDN-Cache-Control            "no-store"  always;
            add_header Cloudflare-CDN-Cache-Control "no-store"  always;
        }

        # -------------------------------------------------------------------------
        # Immutable assets (content-hashed by SvelteKit — safe to cache forever)
        # -------------------------------------------------------------------------
        location ^~ /_app/immutable/ {
            expires max;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            access_log off;
        }

        # -------------------------------------------------------------------------
        # Long-lived static assets
        # -------------------------------------------------------------------------
        location ~* \.(webp|png|ico|svg|ttf)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000" always;
            access_log off;
        }

        # -------------------------------------------------------------------------
        # SvelteKit app — should always revalidate
        # -------------------------------------------------------------------------
        location / {
            try_files $uri $uri/index.html $uri.html =404;
            add_header Cache-Control "no-cache, must-revalidate" always;
        }

        # -------------------------------------------------------------------------
        # Error pages
        # -------------------------------------------------------------------------
        error_page 404 /404.html;
        location = /404.html {
            internal;
        }
    }
}
