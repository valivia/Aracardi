services:
    mongo:
        image: mongo:8
        hostname: aracardi-db
        restart: unless-stopped
        ports:
            - 127.0.0.1:9040:27017
        networks:
            - bridge
        volumes:
            - "./database:/data/db"
        environment:
            MONGO_INITDB_ROOT_USERNAME: mongo
            MONGO_INITDB_ROOT_PASSWORD: password

    server:
        container_name: aracardi-server
        restart: unless-stopped
        build: ./server
        env_file: .env
        volumes:
            - ./cards/addons:/app/addons:ro
        networks:
            - bridge
            - nginx

    client:
        container_name: aracardi-client
        restart: unless-stopped
        build:
            context: app
            args:
                DOMAIN: "aracardi.com"
        networks:
            - nginx

networks:
    bridge:
    nginx:
        external: true
        name: nginx
