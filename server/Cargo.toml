[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.8", features = ["ws"] }
dashmap = "6.1.0"
futures-util = "0.3.31"
nanoid = "0.4.0"
rand = "0.9.2"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.20.0", features = ["v4"] }
tower-http = { version = "0.5", features = ["cors"] }
